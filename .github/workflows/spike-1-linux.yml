name: Spike 1 Linux native modules

# Task 1.1 spike (dsh-forge): node-pty/koffi Linux prebuild feasibility,
# desktop-host headless boot smoke on Linux, preliminary runtime size data.
# Branch is upstream c36ba648 plus only this workflow and scripts/spike-1-linux.
# Results (logs) are committed back to this branch because the fork's Actions
# logs are not retrievable via API from this environment.
on:
  workflow_dispatch:
  push:
    branches: [spike/1.1-linux]

permissions:
  contents: write
env:
  SPIKE_OUT: /tmp/spike-out

jobs:
  native-modules:
    name: native prebuilds (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned native modules
        run: |
          mkdir -p /tmp/native-spike "$SPIKE_OUT" && cd /tmp/native-spike
          npm init -y >/dev/null
          npm install --no-audit --no-fund node-pty@1.2.0-beta.15 koffi@3.1.1 2>&1 | tee "$SPIKE_OUT/install-node${{ matrix.node }}.log"
      - name: Run native smoke
        run: set -o pipefail; node "$GITHUB_WORKSPACE/scripts/spike-1-linux/native-smoke.mjs" 2>&1 | tee "$SPIKE_OUT/smoke-node${{ matrix.node }}.log" || echo "smoke exited non-zero (recorded in log)"
        working-directory: /tmp/native-spike
      - name: Record environment
        run: |
          { uname -a; node -p 'process.versions'; ldd --version | head -1; } | tee "$SPIKE_OUT/env-node${{ matrix.node }}.log"
      - name: Publish results
        if: always()
        run: bash .github/workflows/spike-publish.sh "native-node${{ matrix.node }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  desktop-host:
    name: desktop-host Linux boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace (filtered install lacks devDeps the build needs)
        run: |
          mkdir -p "$SPIKE_OUT"
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$SPIKE_OUT/host-install.log"
        env:
          DSH_TELEMETRY_DISABLED: '1'
          CI: 'true'
      - name: Build host and client libraries
        run: |
          set -o pipefail
          npm run build:lib 2>&1 | tee "$SPIKE_OUT/host-build.log"
        env:
          DSH_TELEMETRY_DISABLED: '1'
      - name: desktop-host boot smoke
        run: set -o pipefail; node "$GITHUB_WORKSPACE/scripts/spike-1-linux/host-smoke.mjs" "$GITHUB_WORKSPACE" 2>&1 | tee "$SPIKE_OUT/host-smoke.log" || echo "host smoke exited non-zero (recorded in log)"
      - name: Preliminary size report
        run: set -o pipefail; node "$GITHUB_WORKSPACE/scripts/spike-1-linux/size-report.mjs" "$GITHUB_WORKSPACE" 2>&1 | tee "$SPIKE_OUT/size-report.log" || echo "size report exited non-zero (recorded in log)"
      - name: Capture environment
        if: always()
        run: |
          { uname -a; node -p 'process.versions'; ldd --version | head -1; df -h "$GITHUB_WORKSPACE" | tail -1; } | tee "$SPIKE_OUT/host-env.log"
      - name: Publish results
        if: always()
        run: bash .github/workflows/spike-publish.sh "desktop-host"
        env:
          GITHUB_TOKEN: ${{ github.token }}

